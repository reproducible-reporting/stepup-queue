[build-system]
requires = ["setuptools>=77.0", "setuptools_scm>=8.1"]
build-backend = "setuptools.build_meta"

[project]
name = "stepup-queue"
authors = [
  { name="Toon Verstraelen", email="toon.verstraelen@ugent.be" },
]
description = "StepUp Queue integrates queued jobs into a StepUp workflow."
readme = "README.md"
license = "LGPL-3.0-or-later"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "path>=16.14.0",
    "rich>=13.0.0",
    "stepup>=4.0.0rc14,<5.0.0a1",
]
dynamic = ["version"]

[project.optional-dependencies]
# What the test suite needs, and nothing more.
# The pytest workflow installs this extra rather than `dev`,
# because it resolves the oldest supported versions of the direct dependencies,
# which is only meaningful for packages that the tests actually exercise.
tests = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.24",
    "pytest-xdist>=3.5.0",
]
dev = [
    "stepup-queue[tests]",
    "mike",
    "mkdocs",
    "mkdocstrings[python]",
    "mkdocs-macros-plugin",
    "mkdocs-material",
    "reuse",
]

[project.urls]
Documentation = "https://reproducible-reporting.github.io/stepup-queue/"
Issues = "https://github.com/reproducible-reporting/stepup-queue/issues"
Source = "https://github.com/reproducible-reporting/stepup-queue/"
Changelog = "https://reproducible-reporting.github.io/stepup-queue/changelog/"

[project.scripts]
sq-sbatch-and-wait = "stepup.queue.sbatch:sbatch"

[project.entry-points."stepup.tools"]
canceljobs = "stepup.queue.canceljobs:canceljobs_subcommand"
removejobs = "stepup.queue.removejobs:removejobs_subcommand"

[tool.pytest.ini_options]
addopts = "-n auto --dist worksteal -W error -W ignore::ResourceWarning"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "A", "B", "BLE", "C4", "E", "EXE", "F", "I", "ICN", "ISC", "N", "NPY", "PERF", "PIE", "PL",
    "PT", "PYI", "RET", "RSE", "RUF", "SIM", "TRY", "UP", "W"
]
ignore = [
    "PLR0904",  # https://docs.astral.sh/ruff/rules/too-many-public-methods/
    "PLR0911",  # https://docs.astral.sh/ruff/rules/too-many-return-statements/
    "PLR0912",  # https://docs.astral.sh/ruff/rules/too-many-branches/
    "PLR0913",  # https://docs.astral.sh/ruff/rules/too-many-arguments/
    "PLR0914",  # https://docs.astral.sh/ruff/rules/too-many-locals/
    "PLR0915",  # https://docs.astral.sh/ruff/rules/too-many-statements/
    "PLR0916",  # https://docs.astral.sh/ruff/rules/too-many-boolean-expressions/
    "PLR0917",  # https://docs.astral.sh/ruff/rules/too-many-positional/
    "PLR2004",  # https://docs.astral.sh/ruff/rules/magic-value-comparison/
    "PLW2901",  # https://docs.astral.sh/ruff/rules/redefined-loop-name/
    "PT011",  # https://docs.astral.sh/ruff/rules/pytest-raises-too-broad/
    "RET503",  # https://docs.astral.sh/ruff/rules/implicit-return/
    "RUF003",  # https://docs.astral.sh/ruff/rules/ambiguous-unicode-character-comment/
    "TRY003",  # https://docs.astral.sh/ruff/rules/raise-vanilla-args/
    "TRY300",  # https://docs.astral.sh/ruff/rules/try-consider-else/
    "TRY301",  # https://docs.astral.sh/ruff/rules/raise-within-try/
]

[tool.ruff.lint.isort]
known-first-party = ["stepup"]

[tool.setuptools]
packages = ["stepup.queue"]

[tool.setuptools_scm]
version_scheme = "post-release"
local_scheme = "no-local-version"

[tool.pymarkdown]
# Report unknown or mistyped settings instead of silently ignoring them.
mode.strict-config = true
# The documentation indents nested lists by four spaces, matching Python-Markdown and MkDocs.
plugins.md007.indent = 4
plugins.md013.line_length = 100
plugins.md013.heading_line_length = 100
plugins.md013.code_block_line_length = 100
# The changelog repeats headings such as "Fixed" under every release,
# which is fine as long as they do not repeat under the same release.
plugins.md024.siblings_only = true
# Rule md041 (first-line-heading) counts the SPDX header in an HTML comment
# as content preceding the first heading.
plugins.md041.enabled = false
